<style id="portable-lessons-style">
#portableLessons{margin:24px 0}#portableLessons button{display:block;width:100%;text-align:left;color:inherit;background:transparent;border:0;padding:18px 0;font:inherit;cursor:pointer}#portableLessons small{display:block;opacity:.7;margin-top:6px}
#portableLessonDialog{position:fixed;inset:0;width:100%;height:100dvh;max-width:none;max-height:none;margin:0;padding:0;border:0;background:rgba(12,12,12,.94);color:white}#portableLessonDialog::backdrop{background:#0008}#portableLessonDialog header{display:flex;justify-content:space-between;padding:12px 20px}#portableLessonDialog button{background:transparent;color:white;border:0;min-height:44px;font:inherit;cursor:pointer}#portableLessonDialog iframe{width:100%;height:calc(100dvh - 68px);border:0}
</style><script id="portable-lessons-ui">
(()=>{'use strict';const host=document.getElementById('kbHome')||document.getElementById('m-knowledge');if(!host)return;const all=JSON.parse(document.getElementById('knowledge-lessons-data').textContent),rows=document.getElementById('knowledge-lessons-ui')?all.slice(1):all;if(!rows.length)return;const catalog=document.createElement('div');catalog.id='portableLessons';const title=document.createElement('h2');title.textContent='分段动作教学';catalog.append(title);host.append(catalog);const modal=document.createElement('dialog');modal.id='portableLessonDialog';modal.setAttribute('aria-label','分段教学');const head=document.createElement('header'),close=document.createElement('button'),label=document.createElement('span');close.textContent='← 返回知识库';head.append(close,label);modal.append(head);document.body.append(modal);let frame=null,trigger=null;function end(){if(frame){frame.remove();frame=null}if(modal.open)modal.close();if(trigger)trigger.focus()}close.onclick=end;modal.addEventListener('cancel',e=>{e.preventDefault();end()});window.addEventListener('message',e=>{if(frame&&e.source===frame.contentWindow&&e.data&&e.data.type==='fitness-lesson-close')end()});rows.forEach(row=>{const b=document.createElement('button'),name=document.createElement('strong'),meta=document.createElement('small');name.textContent=row.title+' ↗';meta.textContent=row.author+' · '+row.chapters+' 个片段 · '+row.duration;b.append(name,meta);b.onclick=()=>{trigger=b;frame=document.createElement('iframe');frame.title=row.title;frame.src=row.path;label.textContent=row.title;modal.append(frame);modal.showModal()};catalog.append(b)})})();
</script>
