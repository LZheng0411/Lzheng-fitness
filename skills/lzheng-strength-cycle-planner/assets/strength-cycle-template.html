<!doctype html>
<html lang="zh-CN" data-ui-template="lzheng-strength-cycle-v1">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>__DOCUMENT_TITLE__</title>
<style>
:root{--bg:#fff;--surface:#f5f5f4;--line:#e5e5e5;--ink:#171717;--muted:#737373;--accent:#1a5c3f;--warn:#c2571f;--nav-h:50px;--page:1040px}*{box-sizing:border-box}html,body{max-width:100%;overflow-x:hidden}html{scroll-behavior:smooth}body{margin:0;padding-top:var(--nav-h);background:var(--bg);color:var(--ink);font:16px/1.65 "PingFang SC","Microsoft YaHei",sans-serif}
header{position:relative;overflow:hidden;border-top:3px solid var(--accent);padding:64px max(28px,calc((100vw - var(--page))/2)) 48px;background:#fff}header:after{content:"";position:absolute;right:max(28px,calc((100vw - var(--page))/2));bottom:0;width:300px;height:210px;background:var(--header-image) right bottom/contain no-repeat;opacity:.96}header>*{position:relative;z-index:1;min-width:0;max-width:660px}h1,h2,h3,p,strong{overflow-wrap:anywhere;word-break:break-word}h1{font-size:42px;line-height:1.16;letter-spacing:-.03em;margin:8px 0 12px}h2{font-size:32px;line-height:1.25;letter-spacing:-.03em;margin:0 0 28px}h3{font-size:26px;line-height:1.3;margin:24px 0 22px;letter-spacing:-.025em}p{margin:0;color:#404040}.eyebrow{color:var(--accent);font-size:13px;letter-spacing:.12em;font-weight:750}
nav{position:fixed;top:0;left:0;right:0;z-index:20;border-bottom:1px solid var(--line);background:rgba(255,255,255,.95);backdrop-filter:blur(8px);padding:12px max(28px,calc((100vw - var(--page))/2));white-space:nowrap;overflow-x:auto}nav a{margin-right:26px;color:var(--muted);text-decoration:none;font-size:14px}nav a:hover,nav a.active{color:var(--accent);font-weight:700}main{width:100%;max-width:var(--page);min-width:0;margin:auto;padding:60px 0 88px;counter-reset:section}section{min-width:0;scroll-margin-top:70px;margin:0 0 72px}section>h2:before{counter-increment:section;content:"0" counter(section);color:#737373;font-size:18px;font-weight:500;margin-right:18px;vertical-align:middle;letter-spacing:0}.lead{max-width:780px;margin:-14px 0 24px;color:var(--muted)}
.parameter-card{min-width:0;background:var(--surface);border-radius:18px;padding:34px 36px 28px}.parameter-card .section-label{display:flex;align-items:center;gap:18px;font-size:30px;font-weight:750;letter-spacing:-.03em;border-top:2px solid var(--line);padding-top:24px}.parameter-card .section-label span{color:#737373;font-size:17px;font-weight:500;letter-spacing:0}.baseline{font-size:18px;line-height:1.7;margin:34px 0 36px;max-width:920px}.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:28px}.metric{min-width:0}.metric strong{display:block;font-size:42px;line-height:1.05;letter-spacing:-.04em}.metric span{display:block;color:var(--muted);margin-top:8px}
.schedule-table,.session-table,.cycle{max-width:100%;overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:760px}th,td{padding:18px 0;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}th{color:var(--muted);font-size:14px;font-weight:500}td{font-size:17px}.schedule-table th:nth-child(1),.schedule-table td:nth-child(1){width:20%}.schedule-table th:nth-child(2),.schedule-table td:nth-child(2){width:31%}.training-cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px}.training-card{border:1px solid var(--line);border-radius:18px;padding:28px 30px;background:#fff}.pill{display:inline-block;background:var(--surface);border-radius:999px;padding:6px 14px;color:#525252;font-size:13px}.training-card h3{font-size:24px;margin:24px 0 20px}.session-table table{min-width:0}.session-table th,.session-table td{padding:14px 0;font-size:15px}.session-table th:nth-child(1),.session-table td:nth-child(1){width:34%}.session-table th:nth-child(2),.session-table td:nth-child(2){width:26%}
.cycle-block{margin:0 0 52px;padding-top:16px;border-top:2px solid var(--ink)}.cycle{margin:14px 0 42px}.cycle th,.cycle td{padding:15px 12px;font-size:14px}.cycle th{font-size:12px}.progression-chart{margin:0 0 20px;overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:#fff}.progression-chart svg{display:block;width:100%;min-width:720px;height:auto}.rule{border-top:1px solid var(--line);padding:24px 0}.rule h3{font-size:20px;margin:0 0 8px}.scope-note{padding:14px 16px;border-left:3px solid var(--accent);background:var(--surface);color:var(--muted);margin-bottom:24px}
@media(max-width:760px){body{padding-top:48px}header{padding:42px 20px 34px}header:after{display:none}h1{font-size:31px}h2{font-size:27px;margin-bottom:24px}main{padding:44px 20px 68px}nav{padding:11px 20px}nav a{margin-right:18px}section{margin-bottom:56px}.parameter-card{padding:25px 20px}.parameter-card .section-label{font-size:24px;padding-top:18px}.metrics{grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}.training-cards{grid-template-columns:1fr;gap:20px}.metric strong{font-size:34px}.baseline{font-size:16px;margin:26px 0 30px}.training-card{padding:24px 20px}.schedule-table table{min-width:650px}}
@media(max-width:420px){.metrics{grid-template-columns:1fr}}
@media print{body{padding-top:0}nav{display:none}header:after{display:none}main{padding:28px 0}.parameter-card,.training-card,.cycle-block{break-inside:avoid}}
</style>
</head>
<body>
<header __HEADER_STYLE__><div class="eyebrow">力量训练周期规划</div><h1>__PLAN_TITLE__</h1><p>__PLAN_SUBTITLE__</p></header>
<nav aria-label="力量周期主导航"><a href="#overview">概览</a><a href="#schedule">周结构</a><a href="#sessions">训练日</a><a href="#cycles">周期</a><a href="#rules">规则</a></nav>
<main>
<section id="overview" data-template-section="overview">__OVERVIEW_HTML__</section>
<section id="schedule" data-template-section="schedule">__SCHEDULE_HTML__</section>
<section id="sessions" data-template-section="sessions">__SESSIONS_HTML__</section>
<section id="cycles" data-template-section="cycles">__CYCLES_HTML__</section>
<section id="rules" data-template-section="rules">__RULES_HTML__</section>
</main>
</body></html>
