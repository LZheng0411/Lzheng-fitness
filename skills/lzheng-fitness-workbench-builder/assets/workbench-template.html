<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>健身工作台</title>
<style>
  :root{
    --bg:#f6f6f4; --card:#ffffff; --ink:#1a1a1a; --muted:#666666; --faint:#999999;
    --line:#e6e6e3; --hero:#161616; --radius:16px; --radius-sm:10px; --tap:44px;
    --serif:"Songti SC","Noto Serif SC","SimSun","STSong",serif;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{background:var(--bg)}
  body{font-family:var(--sans);color:var(--ink);background:var(--bg);
    font-size:14px;line-height:1.55;padding-bottom:76px}
  .appbar{position:sticky;top:0;z-index:20;background:rgba(246,246,244,.92);backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;
    padding:14px 18px 12px}
  .appbar h1{font-size:16px;font-weight:500;letter-spacing:.02em}
  .chip{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:3px 10px;white-space:nowrap}
  main{max-width:960px;margin:0 auto;padding:18px 16px 40px}
  section{display:none} section.on{display:block;animation:fade .18s ease}
  @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

  .hero{background:var(--hero);border-radius:var(--radius);color:#fff;padding:24px 22px 20px;position:relative;overflow:hidden}
  .hero:after{content:"";position:absolute;width:240px;height:240px;border:1px solid rgba(255,255,255,.08);border-radius:50%;right:-90px;top:-130px}
  .hero .hi{font-family:var(--serif);font-size:24px;font-weight:500;letter-spacing:.02em;position:relative;z-index:1}
  .hero .sub{margin-top:6px;font-size:13px;color:rgba(255,255,255,.72)}
  .hero .pills{margin-top:16px;display:flex;flex-wrap:wrap;gap:8px}
  .hero .pill{font-size:12px;border:1px solid rgba(255,255,255,.28);border-radius:99px;padding:5px 12px;color:rgba(255,255,255,.9)}
  .advice{margin-top:14px;background:#fff;color:var(--ink);border-radius:var(--radius-sm);padding:14px 16px;font-size:13px;line-height:1.7}
  .advice b{font-weight:500}
  .today-status{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:start}
  .today-status .eyebrow{font-size:11px;color:var(--faint);letter-spacing:.08em;margin-bottom:4px}
  .today-status .result{font-size:16px;line-height:1.5;font-weight:500}
  .today-status .next{font-size:12px;color:var(--muted);margin-top:5px}
  .today-status .mark{font-size:11px;border-radius:99px;background:#ececea;color:#222;padding:4px 9px;white-space:nowrap}
  .advice .act{margin-top:10px;display:flex;flex-wrap:wrap;gap:8px}
  button{padding:11px 16px;border-radius:var(--radius-sm);border:none;cursor:pointer;font-size:13px;
    background:#161616;color:#fff;font-family:var(--sans);transition:opacity .15s ease,transform .15s ease}
  button:active{transform:scale(.97);opacity:.85}
  button.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}

  h2{font-size:15px;font-weight:500;margin:22px 0 10px;display:flex;align-items:baseline;gap:8px}
  h2 .t{color:var(--faint);font-size:12px;font-weight:400}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
  .ex{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 16px;border-bottom:1px solid var(--line)}
  .ex:last-child{border-bottom:none}
  .ex.main{background:#fbfbfa}
  .ex .l .n{font-size:14px;font-weight:500}
  .ex .l .s{font-size:12px;color:var(--muted);margin-top:2px}
  .ex .r{text-align:right}
  .ex .r .w{font-size:19px;font-weight:500;font-variant-numeric:tabular-nums;letter-spacing:.01em}
  .ex .r .d{font-size:12px;color:var(--muted);margin-top:1px}
  .ex .r .rpe{font-size:12px;color:var(--faint);margin-top:1px}

  .ringwrap{display:flex;align-items:center;gap:18px;padding:18px 16px}
  .ring{position:relative;width:92px;height:92px;flex:none}
  .ring svg{transform:rotate(-90deg)}
  .ring .num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .ring .num .w{font-size:20px;font-weight:500;font-variant-numeric:tabular-nums}
  .ring .num .ph{font-size:11px;color:var(--faint)}
  .ringinfo{flex:1;min-width:0}
  .ringinfo .row{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px}
  .ringinfo .row:last-child{border-bottom:none}
  .ringinfo .row .k{color:var(--muted)} .ringinfo .row .v{font-weight:500;text-align:right}
  .stages{display:flex;gap:6px;padding:5px 16px 34px}
  .stg{border-radius:6px;background:#f1f1ee;height:7px;position:relative}
  .stg.cur{background:#161616}
  .stg span{position:absolute;top:9px;left:0;right:0;text-align:center;font-size:10px;color:var(--faint)}
  .stg span b{display:block;color:var(--muted);font-weight:500}

  .days{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
  .day{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 14px 12px;cursor:pointer;transition:transform .15s ease}
  .day:active{transform:scale(.98)}
  .day.on{background:#161616;color:#fff;border-color:#161616}
  .day.on .dd,.day.on .m{color:rgba(255,255,255,.72)}
  .day .dn{font-size:14px;font-weight:500;display:flex;justify-content:space-between;align-items:baseline}
  .day .st{font-size:11px;color:var(--faint);border:1px solid var(--line);border-radius:99px;padding:1px 8px;margin-left:6px;white-space:nowrap}
  .day.on .st{border-color:rgba(255,255,255,.4);color:rgba(255,255,255,.85)}
  .day .dd{font-size:12px;color:var(--muted);margin-top:3px}
  .day .m{margin-top:8px;font-size:12px;color:var(--muted);line-height:1.5}

  .note{margin-top:12px;font-size:12px;color:var(--muted);background:#efefec;border-radius:var(--radius-sm);padding:11px 13px;line-height:1.65}
  .hint{margin-top:10px;font-size:12px;color:var(--faint)}
  .syncbar{margin:10px 18px 0;font-size:12px;padding:9px 13px;border-radius:10px;display:flex;gap:8px;align-items:baseline;line-height:1.5;flex-wrap:wrap}
  .syncbar.ok{background:#efefec;color:var(--muted)}
  .syncbar.stale{background:#ececea;color:#444}
  .syncbar.failed{background:#dededb;color:#222}
  .syncbar b{font-weight:500}

  .wk .row{display:flex;justify-content:space-between;gap:12px;padding:13px 16px;border-bottom:1px solid var(--line);align-items:baseline}
  .wk .row:last-child{border-bottom:none}
  .wk .row .k{font-weight:500;white-space:nowrap}
  .wk .row .v{text-align:right;color:var(--muted);font-size:13px}

  #chartBox{display:grid;gap:14px;background:transparent;border:none;overflow:visible}
  .chartcard{padding:18px 18px 16px;background:linear-gradient(145deg,#fff 0%,#fbfbfa 100%);border:1px solid #e3e3df;border-radius:18px;box-shadow:0 8px 28px rgba(20,20,20,.035)}
  .chartcard .ttl{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:9px;gap:12px}
  .chartcard .ttl .n{font-size:15px;font-weight:600;letter-spacing:.01em}
  .chartcard .ttl .cap{font-size:10px;color:var(--faint);background:#f1f1ee;border-radius:99px;padding:3px 8px;white-space:nowrap}
  .chartcard .plot{background:#fff;border:1px solid #eeeeeb;border-radius:13px;padding:4px 5px 0;overflow:hidden}
  .chartcard svg{width:100%;height:142px;display:block}
  .chartcard .actuals{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
  .chartcard .actual{font-size:10px;color:#4f4f4b;background:#f0f0ed;border-radius:99px;padding:4px 8px}
  .chartcard .lg{display:flex;gap:16px;margin-top:10px;font-size:11px;color:var(--muted);align-items:center;flex-wrap:wrap}
  .chartcard .lg i{display:inline-block;width:20px;height:2px;background:#161616;vertical-align:middle;margin-right:5px}
  .chartcard .lg i.plan{height:0;background:none;border-top:2px dashed #aaa9a3}
  .chartcard .lg .stat{margin-left:auto;color:var(--faint)}

  .bwrow{display:flex;justify-content:space-between;gap:10px;padding:11px 16px;border-bottom:1px solid var(--line);font-size:13px;align-items:baseline}
  .bwrow:last-child{border-bottom:none}
  .bwrow .k{color:var(--muted)} .bwrow .v{font-weight:500;font-variant-numeric:tabular-nums}
  .dots{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;padding:16px}
  .dot{display:flex;flex-direction:column;align-items:center;gap:4px}
  .dot .c{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--faint)}
  .dot .c.train{background:#161616;color:#fff}
  .dot .c.rest{background:transparent;border:1px solid var(--line)}
  .dot .c.miss{background:transparent;border:1px dashed var(--line)}
  .dot .d{font-size:10px;color:var(--faint)}
  .dotlegend{display:flex;gap:16px;padding:0 16px 14px;font-size:11px;color:var(--faint)}
  .dotlegend i{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:4px;vertical-align:-2px;border:1px solid var(--line)}
  .dotlegend .b i{background:#161616;border-color:#161616}
  .dotlegend .m i{border-style:dashed}

  .rv .row{padding:12px 16px;border-bottom:1px solid var(--line)}
  .rv .row:last-child{border-bottom:none}
  .rv .top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
  .rv .top .vd{font-size:13px} .rv .top .dt{font-size:11px;color:var(--faint);white-space:nowrap}
  .rv .st{font-size:12px;color:var(--muted);margin-top:3px}
  .rv a.row{display:block;text-decoration:none;color:inherit}
  .rv a.row:hover{background:#fafaf8}
  .rv .open{font-size:11px;color:var(--faint);margin-top:5px}
  .links{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
  .link{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;text-decoration:none;color:var(--ink);display:block;transition:transform .15s ease}
  .link:active{transform:scale(.98)}
  .link .n{font-size:13px;font-weight:500} .link .s{font-size:11px;color:var(--faint);margin-top:2px}

  .setrow{display:flex;justify-content:space-between;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);font-size:13px;align-items:baseline}
  .setrow:last-child{border-bottom:none}
  .setrow .k{color:var(--muted)} .setrow .v{text-align:right;font-weight:500}

  .nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);
    border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
  .nav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 0 8px;color:var(--faint);
    text-decoration:none;font-size:11px;min-height:52px;justify-content:center;transition:color .15s ease}
  .nav a i{width:22px;height:3px;border-radius:2px;background:currentColor;display:block;opacity:0;transition:opacity .15s ease}
  .nav a.on{color:var(--ink)} .nav a.on i{opacity:1}

  footer{margin-top:26px;padding-top:14px;border-top:1px solid var(--line);font-size:11px;color:var(--faint);
    display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}

  @media (min-width:900px){
    body{padding-left:176px;padding-bottom:40px}
    .nav{top:0;right:auto;bottom:0;left:0;width:168px;border-right:1px solid var(--line);border-top:none;
      flex-direction:column;justify-content:center;gap:6px;padding:20px 10px;background:rgba(255,255,255,.92)}
    .nav a{flex:none;flex-direction:row;justify-content:flex-start;gap:10px;padding:12px 16px;min-height:44px;font-size:13px;border-radius:var(--radius-sm)}
    .nav a i{width:3px;height:18px;order:-1}
    .nav a.on{background:#f0f0ed}
    main{display:block;padding:24px 28px 60px}
    .two{display:grid;grid-template-columns:1.05fr .95fr;gap:0 26px;align-items:start}
    h2{margin-top:26px}
    .days{grid-template-columns:repeat(4,1fr)}
    .links{grid-template-columns:repeat(4,1fr)}
  }
  @media (max-width:520px){
    .hero{padding:21px 17px 18px}
    .hero .hi{font-size:21px}
    .today-status{grid-template-columns:1fr}
    .today-status .mark{justify-self:start}
    .ex{align-items:flex-start;padding:13px}
    .ex .r .w{font-size:17px}
    .ringwrap{align-items:flex-start;gap:12px}
    .ringinfo .row{display:block}
    .ringinfo .row .v{display:block;text-align:left;margin-top:2px}
    .chartcard{padding:14px 12px 13px;border-radius:15px}
    .chartcard svg{height:128px}
    .chartcard .lg .stat{width:100%;margin-left:0}
  }

  /* 2026-08 product UI system */
  :root{
    --bg:#f2f1ed;--card:#fbfbf9;--ink:#171816;--muted:#666861;--faint:#96988f;
    --line:#dddcd5;--hero:#191a18;--accent:#161616;--accent-soft:#ececea;
    --radius:22px;--radius-sm:13px;--shadow:0 16px 44px rgba(27,28,25,.055);
  }
  html{background:var(--bg)}
  body{min-height:100vh;background:
    radial-gradient(circle at 92% 0,rgba(215,255,63,.10),transparent 24rem),var(--bg);
    font-size:14px;line-height:1.58;color:var(--ink)}
  .appbar{height:66px;padding:0 24px;background:rgba(242,241,237,.83);backdrop-filter:blur(18px) saturate(130%);

  .chip{font-size:10px;font-weight:550;letter-spacing:.04em;background:rgba(255,255,255,.5);border-color:rgba(23,24,22,.1);padding:5px 10px}
  .syncbar{max-width:1180px;margin:12px auto 0;padding:8px 12px;border:1px solid rgba(23,24,22,.06)}
  .syncbar.ok{background:rgba(255,255,255,.42)}
  main{max-width:1180px;padding:26px 24px 70px}
  section.on{animation:productFade .28s cubic-bezier(.2,.7,.2,1)}
  @keyframes productFade{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
  h2{font-size:12px;font-weight:650;letter-spacing:.08em;text-transform:uppercase;color:#50524c;margin:30px 0 12px}
  h2 .t{font-size:11px;letter-spacing:0;text-transform:none;color:var(--faint)}
  .card{background:rgba(251,251,249,.88);border:1px solid rgba(23,24,22,.09);border-radius:var(--radius);box-shadow:var(--shadow)}

  .hero{min-height:330px;padding:38px 38px 32px;border-radius:28px;background:
    radial-gradient(circle at 88% 12%,rgba(215,255,63,.18),transparent 15rem),
    linear-gradient(135deg,#1a1b19 0%,#242621 100%);box-shadow:0 24px 64px rgba(18,19,17,.18)}
  .hero:before{content:"TRAINING / W" attr(data-week);position:absolute;right:36px;bottom:27px;color:rgba(255,255,255,.08);
    font-size:48px;font-weight:750;letter-spacing:-.05em}
  .hero:after{width:320px;height:320px;border-color:rgba(215,255,63,.12);right:-70px;top:-190px}
  .hero .hi{font-family:var(--sans);font-size:34px;font-weight:650;letter-spacing:-.035em;line-height:1.18;max-width:680px}
  .hero .sub{margin-top:10px;font-size:14px;color:rgba(255,255,255,.58)}
  .hero .pills{margin-top:24px;gap:7px}
  .hero .pill{padding:5px 10px;border-color:rgba(255,255,255,.13);background:rgba(255,255,255,.055);font-size:10px;font-weight:550;letter-spacing:.03em}
  .advice{position:relative;z-index:2;max-width:760px;margin-top:25px;padding:18px 19px;border-radius:16px;background:rgba(255,255,255,.96);box-shadow:0 14px 34px rgba(0,0,0,.16)}
  .today-status .eyebrow{color:#7c7f75;font-weight:650;letter-spacing:.11em}
  .today-status .result{font-size:15px;font-weight:600;letter-spacing:-.01em}
  .today-status .mark{background:var(--accent);color:#1d2015;font-weight:700}
  button{border-radius:12px;background:#20211e;font-weight:600;padding:10px 14px}
  button.ghost{background:#f1f1ed;border-color:#deded7}
  #todayList{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:18px}
  .ex{position:relative;min-height:116px;padding:18px 18px 16px;background:rgba(251,251,249,.9);border:1px solid rgba(23,24,22,.09)!important;border-radius:18px;box-shadow:0 9px 28px rgba(25,26,23,.035);align-items:flex-start}
  .ex.main{background:linear-gradient(145deg,#23241f,#191a18);color:#fff;border-color:#23241f!important}
  .ex.main:before{content:"MAIN";position:absolute;left:18px;bottom:14px;font-size:9px;font-weight:750;letter-spacing:.12em;color:var(--accent)}
  .ex.main .s,.ex.main .d,.ex.main .rpe{color:rgba(255,255,255,.55)!important}
  .ex .l{max-width:42%}.ex .l .n{font-size:14px;font-weight:650}.ex .l .s{font-size:10px;color:var(--faint);margin-top:6px;line-height:1.45}
  .ex .r{max-width:58%}.ex .r .w{font-size:22px;font-weight:680;letter-spacing:-.035em}.ex .r .d{font-size:11px;margin-top:5px}.ex .r .rpe{font-size:10px;margin-top:4px}
  .note{border:1px solid rgba(23,24,22,.055);background:rgba(255,255,255,.38);border-radius:14px;padding:12px 14px}

  .ringwrap{padding:26px 27px;gap:28px}.ring{width:112px;height:112px}.ring svg{width:112px;height:112px;overflow:visible}
  .ring .num .w{font-size:24px;font-weight:680;letter-spacing:-.04em}.ring .num .ph{font-size:10px;letter-spacing:.05em}
  .ringinfo .row{padding:9px 0;border-color:rgba(23,24,22,.07)}.ringinfo .row .k{font-size:11px}.ringinfo .row .v{font-size:13px;font-weight:600}
  .stages{padding:8px 27px 40px;gap:7px}.stg{height:8px;background:#e8e7e0}.stg.cur{background:var(--accent);box-shadow:0 0 0 1px rgba(23,24,22,.08)}
  .stg span{top:12px}.stg span b{font-size:10px;font-weight:650;color:#55574f}
  .days{gap:12px}.day{min-height:150px;padding:17px;border-radius:18px;border-color:rgba(23,24,22,.09);box-shadow:0 9px 26px rgba(25,26,23,.032)}
  .day:hover{transform:translateY(-2px);box-shadow:0 14px 32px rgba(25,26,23,.07)}
  .day.on{background:#1d1e1b;border-color:#1d1e1b;box-shadow:0 14px 34px rgba(20,21,18,.16)}
  .day.on:after{content:"";display:block;width:32px;height:4px;border-radius:99px;background:var(--accent);margin-top:14px}
  .day .dn{font-size:13px;font-weight:680}.day .st{font-size:9px;padding:2px 7px}.day .dd{font-size:10px;margin-top:8px}.day .m{font-size:11px;line-height:1.6;margin-top:11px}
  .wk .row{padding:17px 19px;align-items:flex-start}.wk .row .k{font-size:12px;font-weight:700}.wk .row .v{max-width:78%;font-size:11px;line-height:1.65}

  #chartBox{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
  .chartcard{padding:18px;background:rgba(251,251,249,.9);border-color:rgba(23,24,22,.09);border-radius:20px;box-shadow:0 14px 38px rgba(25,26,23,.045)}
  .chartcard .plot{background:#f7f7f3;border:none;border-radius:14px}.chartcard svg{height:156px}
  .chartcard .ttl .n{font-size:14px;font-weight:680}.chartcard .ttl .cap{background:#eeeeea;font-size:9px}
  .chartcard .actual{background:#20211e;color:#f7f7f2;font-size:9px}.chartcard .lg{font-size:10px}.chartcard .lg .stat{font-size:9px}
  #bwBox,#dotBox{overflow:hidden}.bwrow{padding:13px 17px}.dots{padding:22px}.dot .c{width:30px;height:30px}.dot .c.train{background:#20211e;box-shadow:inset 0 -3px 0 var(--accent)}

  .rv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0;overflow:hidden}
  .rv .row{min-height:160px;padding:19px;border-right:1px solid rgba(23,24,22,.07);border-bottom:1px solid rgba(23,24,22,.07)}
  .rv .top{align-items:flex-start}.rv .top .vd{font-size:13px;font-weight:620;line-height:1.65}.rv .top .dt{font-size:10px;background:#efefeb;border-radius:99px;padding:3px 7px}

  #m-trend,#m-settings{background:transparent}
  #m-trend>h2,#m-settings>h2{font-size:18px;font-weight:760;letter-spacing:-.02em;margin:32px 0 13px}
  #m-trend>h2:first-child,#m-settings>h2:first-child{margin-top:20px}

  #chartBox{background:transparent!important;box-shadow:none!important;backdrop-filter:none!important}
  .chartcard{
    padding:22px;background:rgba(248,248,245,.60);border:1px solid rgba(0,0,0,.20);
    box-shadow:0 22px 52px rgba(0,0,0,.10);backdrop-filter:blur(5px) saturate(0)
  }
  .chartcard .plot{
    padding:9px 8px 2px;background:rgba(255,255,255,.10);border:1px solid rgba(0,0,0,.16);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.35);backdrop-filter:none
  }
  .chartcard svg{height:188px}.chartcard .ttl .n{font-size:18px;font-weight:780}
  .chartcard .ttl .cap{color:#333;background:rgba(255,255,255,.35);border-color:rgba(0,0,0,.15);font-weight:650}
  .chartcard .lg{color:#343434;font-weight:600}.chartcard .lg .stat{color:#5f5f5b}
  .chartcard .actual{background:rgba(8,8,8,.94);box-shadow:0 4px 10px rgba(0,0,0,.10)}

  #bwBox{padding:12px;background:rgba(248,248,245,.60);border-color:rgba(0,0,0,.20);backdrop-filter:blur(5px) saturate(0)}
  .weight-table{overflow:hidden;border:1px solid rgba(0,0,0,.18);border-radius:14px;background:rgba(255,255,255,.16)}
  .weight-row{display:grid;grid-template-columns:120px minmax(0,1fr) 110px 128px;align-items:center;min-height:54px;border-bottom:1px solid rgba(0,0,0,.13)}
  .weight-row:last-child{border-bottom:none}.weight-row.header{min-height:38px;background:rgba(8,8,8,.88);color:#fff}
  .weight-cell{padding:10px 14px;font-size:12px}.weight-row.header .weight-cell{font-size:9px;font-weight:720;letter-spacing:.13em;color:rgba(255,255,255,.68)}
  .weight-date{font-variant-numeric:tabular-nums;color:#666}.weight-source{font-weight:650}.weight-value{font-size:17px;font-weight:790;font-variant-numeric:tabular-nums;text-align:right}
  .weight-status{text-align:right}.weight-status span{display:inline-block;padding:4px 8px;border:1px solid rgba(0,0,0,.13);border-radius:999px;background:rgba(255,255,255,.38);font-size:9px;font-weight:700}
  #bwNote{background:rgba(248,248,245,.52);border-color:rgba(0,0,0,.15);backdrop-filter:blur(5px) saturate(0)}

  #ruleBox{gap:12px;background:transparent;border:none;box-shadow:none;overflow:visible;backdrop-filter:none}
  .rule-item{border:1px solid rgba(0,0,0,.17);border-radius:15px;background:rgba(248,248,245,.62);box-shadow:0 14px 34px rgba(0,0,0,.06);backdrop-filter:blur(5px) saturate(0);overflow:hidden}
  .rule-item summary{align-items:flex-start;padding:18px 19px}.rule-item summary:after{flex:none;margin-top:1px}
  .rule-head{min-width:0}.rule-title{display:block;font-size:14px;font-weight:780;letter-spacing:-.01em}
  .rule-preview{display:grid;gap:7px;margin-top:13px}.rule-preview span{position:relative;padding-left:13px;font-size:10px;font-weight:500;line-height:1.55;color:#585854}
  .rule-preview span:before{content:"";position:absolute;left:0;top:.58em;width:5px;height:5px;border-radius:50%;background:#111}
  .rule-item[open]{grid-column:1/-1;background:rgba(248,248,245,.82)}
  .rule-item[open] .rule-preview{display:none}.rule-body{padding:0 19px 20px;border-top:1px solid rgba(0,0,0,.10);padding-top:16px;font-size:11px;line-height:1.8;color:#4d4d49}

  @media (min-width:900px){
    .nav{
      background-image:
        linear-gradient(180deg,rgba(5,5,5,.62),rgba(5,5,5,.42)),
        url("工作台与工具/健身工作台开发/界面素材/garou-cosmic-crouch.png");
      background-size:auto,cover;background-position:center,50% 50%;background-repeat:no-repeat;
      border-right:1px solid rgba(255,255,255,.13);box-shadow:18px 0 48px rgba(0,0,0,.16);
      backdrop-filter:blur(4px) brightness(.76) saturate(0)
    }
    .nav a{color:rgba(255,255,255,.62);text-shadow:0 1px 7px rgba(0,0,0,.5)}
    .nav a.on{background:rgba(246,246,243,.90);color:#111;text-shadow:none;box-shadow:0 9px 24px rgba(0,0,0,.14)}
  }
  @media (max-width:899px){
    body{
      background-image:linear-gradient(rgba(239,239,236,.88),rgba(239,239,236,.83)),url("工作台与工具/健身工作台开发/界面素材/garou-cosmic-crouch.png");
      background-position:50% center;
    }
    .hero{
      background-image:linear-gradient(180deg,rgba(5,5,5,.36) 0%,rgba(5,5,5,.58) 44%,rgba(5,5,5,.94) 100%),url("工作台与工具/健身工作台开发/界面素材/garou-cosmic-crouch.png");
      background-position:50% 50%;
    }
    .weight-row{grid-template-columns:94px minmax(0,1fr) 82px}.weight-status{display:none}
  }
  @media (max-width:520px){
    #m-trend>h2,#m-settings>h2{font-size:17px;margin-top:27px}.chartcard svg{height:176px}
    .weight-row{grid-template-columns:76px minmax(0,1fr) 66px;min-height:50px}.weight-cell{padding:9px 8px;font-size:10px}.weight-value{font-size:14px}
    .rule-item[open]{grid-column:auto}
  }
</style>
</head>
<body>

<div class="appbar">
  <h1>健身工作台</h1>
  <span class="chip" id="verChip"></span>
</div>
<div class="syncbar" id="syncBar"></div>

<main>
  <section id="m-today" class="on">
    <div class="hero">
      <div class="hi" id="heroHi"></div>
      <div class="sub" id="heroSub"></div>
      <div class="pills" id="heroPills"></div>
      <div class="advice" id="heroAdvice"></div>
    </div>
    <div id="todayList"></div>
    <div class="note" id="todayNote"></div>
  </section>

  <section id="m-week">
    <h2>周期进度 <span class="t" id="weekLabel"></span></h2>
    <div class="card" id="cycleCard">
      <div class="ringwrap">
        <div class="ring" id="ringBox"></div>
        <div class="ringinfo" id="ringInfo"></div>
      </div>
      <div class="stages" id="stageBar"></div>
    </div>
    <h2 id="weekDaysHeading">本周训练日</h2>
    <div class="days" id="dayGrid"></div>
    <div class="note" id="weekNote"></div>
    <h2 id="goalMetricsHeading">目标数据</h2>
    <div class="card" id="goalMetricBox"></div>
    <h2 id="weekFocusHeading">本周重点 · <span id="weekMainLabel">W2</span></h2>
    <div class="card wk" id="weekMain"></div>
  </section>

  <section id="m-trend">
    <h2 id="trendHeading">训练进展</h2>
    <div class="card" id="chartBox"></div>
    <h2>体重趋势</h2>
    <div class="card" id="bwBox"></div>
    <div class="note" id="bwNote"></div>
    <h2>最近 14 天打卡</h2>
    <div class="card" id="dotBox"></div>
  </section>

  <section id="m-record">
    <h2>最近复盘</h2>
    <div class="card rv" id="reviewBox"></div>
    <h2>入口</h2>
    <div class="links" id="linkBox"></div>
    <div class="note">复盘条目会通过 Obsidian 深链直接打开本地文件；首次点击若浏览器询问是否允许打开 Obsidian，请选择允许。</div>
  </section>

  <section id="m-settings">
    <h2>数据与同步</h2>
    <div class="card" id="setBox"></div>
    <h2>规则要点</h2>
    <div class="card" id="ruleBox"></div>
    <h2>怎么用</h2>
    <div class="note" id="howNote"></div>
  </section>
</main>

<nav class="nav" id="navBar"></nav>
<footer>
  <span>数据源：当前周期 JSON · 个人训练系统</span>
  <span>动态记录：Notion 训练系统</span>
</footer>

<script id="workbench-data" type="application/json">{}</script>

<script>
(function(){
  var D = JSON.parse(document.getElementById('workbench-data').textContent);
  var m = D.meta;
  var onboarding = D.onboarding || {completed:true, message:''};
  var systemInfo = D.system || {};
  var trainingStatus = D.status || {};
  var knowledge = D.knowledge || {};
  var objectiveLabels = {
    strength: '力量',
    hypertrophy: '增肌',
    fat_loss: '减脂',
    general_fitness: '综合健身'
  };
  var objectiveLabel = objectiveLabels[m.objective_mode] || '训练计划';
  var objectiveSignals = {
    strength: ['动作质量与完成标准', '关键动作的重量、次数与余力', '阶段测试或复盘结论'],
    hypertrophy: ['动作质量与目标次数', '重量、次数与余力', '肌群训练完成情况'],
    fat_loss: ['力量训练完成情况', '体重或围度趋势', '步数、有氧与恢复'],
    general_fitness: ['训练完成情况', '重量、次数与动作质量', '恢复与日常活动']
  };
  var activeSignals = objectiveSignals[m.objective_mode] || objectiveSignals.general_fitness;

  function el(tag, cls, html){ var n=document.createElement(tag); if(cls)n.className=cls; if(html!=null)n.innerHTML=html; return n; }
  function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function pad(n){ return n<10?'0'+n:''+n; }

  function displayDayDate(day){
    if(!day) return '待排期';
    return day.date ? day.date.slice(5) : (D.weekday[day.title] || '待排期');
  }

  function trainingDayOrder(){
    var defaults = ['上肢A','腿A','上肢B','腿B'];
    if(defaults.every(function(name){ return D.days[name]; })) return defaults;
    return Object.keys(D.days || {}).sort(function(a,b){
      var ad = (D.days[a] && D.days[a].date) || '';
      var bd = (D.days[b] && D.days[b].date) || '';
      return ad.localeCompare(bd) || a.localeCompare(b);
    });
  }

  function prescriptionLabel(exercise){
    if(exercise && exercise.w) return exercise.w;
    if(exercise && String(exercise.d || '').indexOf('待校准') >= 0) return '待校准';
    return '见计划';
  }

  document.getElementById('verChip').textContent = '来源 v' + m.source_version.replace('v','') + ' · 更新于 ' + m.updated_at;

  var sync = D.sync || { status:'unknown', reason:null, stale_fields:[] };
  var syncBar = document.getElementById('syncBar');
  if(sync.status === 'ok'){
    syncBar.className = 'syncbar ok';
    syncBar.innerHTML = '<span>数据已同步</span><span>' + (sync.last_success || '') + '</span>';
  } else if(sync.status === 'stale'){
    syncBar.className = 'syncbar stale';
    syncBar.innerHTML = '<b>数据待同步</b><span>' + (sync.reason || 'Notion 未连接') + '</span>';
  } else if(sync.status === 'failed'){
    syncBar.className = 'syncbar failed';
    syncBar.innerHTML = '<b>同步失败</b><span>' + (sync.reason || '未知原因') + '｜未刷新：' + (sync.stale_fields||[]).join('、') + '</span>';
  } else {
    syncBar.style.display = 'none';
  }

  var now = new Date();
  function localDate(d){ return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()); }
  var todayIso = localDate(now);
  var timeline = D.timeline || [];
  var todayEvent = timeline.filter(function(x){return x.date===todayIso;})[0] || null;
  var todayName = todayEvent && todayEvent.type==='training' ? todayEvent.day : null;
  var todayWd = ['周日','周一','周二','周三','周四','周五','周六'][now.getDay()];

  function dayNum(){
    var s = new Date(m.plan_start);
    return Math.floor((now - s)/86400000) + 1;
  }
  function daysToTest(){
    var s = new Date(m.plan_start);
    var testStart = new Date(s); testStart.setDate(s.getDate() + ((m.test_week||m.total_weeks||8)-1)*7);
    return Math.ceil((testStart - now)/86400000);
  }

  var heroHi = document.getElementById('heroHi');
  var heroSub = document.getElementById('heroSub');
  var pills = document.getElementById('heroPills');
  var advice = document.getElementById('heroAdvice');
  var todayList = document.getElementById('todayList');
  var todayNote = document.getElementById('todayNote');
  var hh = now.getHours();
  document.querySelector('.hero').setAttribute('data-week',m.current_week);
  var greet = hh<6?'夜深了': hh<12?'早上好': hh<14?'中午好': hh<18?'下午好':'晚上好';

  function renderExCard(e){
    var card = el('div','ex' + (e.main?' main':''));
    var l = el('div','l'); l.appendChild(el('div','n',e.name));
    if(e.weight_source) l.appendChild(el('div','s','重量依据：'+e.weight_source));
    var r = el('div','r');
    r.appendChild(el('div','w', e.w || '—'));
    if(e.d) r.appendChild(el('div','d',e.d));
    if(e.rpe) r.appendChild(el('div','rpe',e.rpe));
    card.appendChild(l); card.appendChild(r);
    return card;
  }

  function nextEvent(){
    return timeline.filter(function(x){return x.date>todayIso;})[0] || null;
  }
  function renderToday(name){
    pills.innerHTML=''; advice.innerHTML=''; todayList.innerHTML='';
    if(!onboarding.completed){
      if(onboarding.mode==='needs_calibration'){
        var calibrationName=Object.keys(D.days||{})[0];
        var calibrationDay=calibrationName ? D.days[calibrationName] : null;
        heroHi.textContent = '先完成重量校准';
        heroSub.textContent = onboarding.message || '按每个动作的引导确定今天的工作重量。';
        pills.appendChild(el('span','pill','不猜重量 · 逐步校准'));
        advice.innerHTML = '<b>今天怎么做</b><div>从轻重量试组开始；每次小幅增加。完成目标次数后仍保留约 2—4 次余力、动作稳定时，记录为工作重量。</div>';
        if(calibrationDay){
          Object.keys(D.days).forEach(function(key){
            if(key===calibrationName){ D.days[key].exercises.forEach(function(e){ todayList.appendChild(renderExCard(e)); }); }
          });
          todayNote.textContent = '先校准 ' + calibrationName + '；完成后把重量、次数、余力和动作感受告诉 AI，它会写入下一次明确处方。';
        }
        return;
      }
      heroHi.textContent = '待建档';
      heroSub.textContent = onboarding.message || '先确认目标、训练频率、器械与当前状态。';
      pills.appendChild(el('span','pill','未显示正式训练重量'));
      advice.innerHTML = '<b>下一步</b><div>完成问诊和正式计划确认后，工作台才会显示可执行重量与今日处方。</div>';
      todayNote.textContent = '当前仅为安全初始化状态；页面不会把示例数据当成训练事实。';
      return;
    }
    var isDefault = name===todayName || (!todayName && !name);
    var completedToday = isDefault && todayEvent && todayEvent.status==='done';
    var summary = D.today_summary || null;
    var reviewedToday = completedToday && summary && summary.date===todayIso && summary.day===name;
    var upcoming = nextEvent();
    if(name){
      heroHi.textContent = completedToday ? '今日已完成 · ' + name : (isDefault ? '今日训练 · ' + name : name + ' · ' + displayDayDate(D.days[name]));
      heroSub.textContent = 'W' + m.current_week + ' / ' + m.phase + '期 · ' + D.days[name].role;
    } else {
      heroHi.textContent = '今日恢复';
      heroSub.textContent = 'W' + m.current_week + ' / ' + m.phase + '期 · ' + (todayEvent ? todayEvent.role : '未安排正式训练');
    }
    function pill(t){ pills.appendChild(el('span','pill',t)); }
    var dt = daysToTest();
    pill('W' + m.current_week + ' / ' + m.total_weeks + ' · ' + m.phase + '期');
    pill(objectiveLabel + '计划');
    pill(dt>0 ? '本阶段剩余 ' + dt + ' 天' : '本阶段复盘');
    if(name && !isDefault) pill(displayDayDate(D.days[name]));
    var adv = el('div',null);
    if(reviewedToday){
      adv.innerHTML = '<div class="today-status"><div><div class="eyebrow">今日关键结果</div><div class="result">' +
        esc(summary.result || '训练记录已同步，详细结果见下方。') + '</div><div class="next">' +
        esc(summary.next || (upcoming ? '下一安排：' + upcoming.date.slice(5) + ' · ' + (upcoming.day || upcoming.title) : '等待下一次安排')) +
        '</div></div><span class="mark">已复盘</span></div>';
    } else if(completedToday){
      adv.innerHTML = '<div class="today-status"><div><div class="eyebrow">训练已完成</div><div class="result">完成状态已同步，尚未找到与今天日期和训练日完全匹配的复盘。</div><div class="next">写入复盘后，今日关键结果会自动替换这里。</div></div><span class="mark">待复盘</span></div>';
    } else {
      adv.appendChild(el('b',null, name ? (isDefault ? '今日处方' : '当日处方') : '恢复安排'));
      adv.appendChild(el('div',null, name ? '以下为当天完整处方；所有重量均来自当前 ' + m.source_version + ' 或 Notion 最近同动作记录。' : (upcoming ? '下一次：' + upcoming.date.slice(5) + ' · ' + (upcoming.day || upcoming.title) : D.advice)));
    }
    var act = el('div','act');
    if(name){
      var idleButtonText = completedToday?'复制本次记录':'复制练后记录模板';
      var btn = el('button',null,idleButtonText);
      btn.onclick = function(){
        var lines = ['今天练了 ' + name + '（' + m.source_version + ' · W' + m.current_week + '）：'];
        D.days[name].exercises.forEach(function(e){
          var prescription = [e.w || '', e.d || '待确认'].filter(Boolean).join(' ');
          lines.push('□ ' + e.name + ' 处方 ' + prescription + ' → 实际：');
        });
        lines.push('体重：____ ｜ 睡眠：____ ｜ 异常酸痛：____');
        var txt = lines.join('\n');
        function fb(){ var ta=document.createElement('textarea'); ta.value=txt; document.body.appendChild(ta); ta.select(); try{document.execCommand('copy');}catch(e){} document.body.removeChild(ta); btn.textContent='已复制'; setTimeout(function(){btn.textContent=idleButtonText;},1600); }
        if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(txt).then(function(){btn.textContent='已复制'; setTimeout(function(){btn.textContent=idleButtonText;},1600);}).catch(fb); } else { fb(); }
      };
      act.appendChild(btn);
    }
    adv.appendChild(act);
    advice.appendChild(adv);
    if(name){
      D.days[name].exercises.forEach(function(e){ todayList.appendChild(renderExCard(e)); });
    }
    var eventState = name && D.days[name] ? (D.done[name] || ('计划 ' + (D.days[name].date||'待排期'))) : '';
    todayNote.textContent = (name ? (eventState + ' · ') : '') + '页面按 ' + m.source_version + ' 实际日期安排匹配今日内容；周次仍以复盘索引为准（当前 W' + m.current_week + '）。';
    var hint = el('div','hint');
    hint.textContent = '对 AI 说「同步工作台」刷新数据 · 「发布工作台」更新在线版';
    advice.appendChild(hint);
  }
  renderToday(todayName);

  var weekLabel = document.getElementById('weekLabel');
  weekLabel.textContent = 'W' + m.current_week + ' / ' + m.total_weeks;
  document.getElementById('weekMainLabel').textContent = 'W' + m.current_week;
  document.getElementById('weekDaysHeading').textContent = '本周训练日 · ' + objectiveLabel;
  document.getElementById('weekFocusHeading').innerHTML = '本周重点 · <span id="weekMainLabel">W' + m.current_week + '</span>';
  document.getElementById('trendHeading').textContent = Object.keys(D.charts || {}).length ? '训练进展' : objectiveLabel + '执行信号';

  var ringBox = document.getElementById('ringBox');
  var completedWeeks = Math.max(0,m.current_week-1);
  var weekDates = timeline.filter(function(x){return x.type==='training';});
  var weekDone = weekDates.filter(function(x){return x.status==='done';}).length;
  var weekTotal = weekDates.length || 4;
  var pct = Math.min(1,(completedWeeks + weekDone/weekTotal) / m.total_weeks);
  var C = 2*Math.PI*40;
  ringBox.innerHTML = '<svg viewBox="0 0 92 92" aria-hidden="true"><circle cx="46" cy="46" r="40" fill="none" stroke="#dededb" stroke-width="7"/><circle cx="46" cy="46" r="40" fill="none" stroke="#111" stroke-width="7" stroke-linecap="round" stroke-dasharray="' + (C*pct).toFixed(1) + ' ' + C.toFixed(1) + '"/></svg>' +
    '<div class="num"><span class="w">' + Math.round(pct*100) + '%</span><span class="ph">周期完成</span></div>';
  var ringInfo = document.getElementById('ringInfo');
  function timelineTraining(name){
    var target=D.days[name]&&D.days[name].date;
    return timeline.filter(function(x){return x.type==='training'&&x.day===name&&(!target||x.date===target);})[0]||null;
  }
  function eventPrescription(x){
    if(!x||!x.day||!D.days[x.day]) return x ? x.date.slice(5)+' '+(x.title||'待安排') : '等待下一次安排';
    var mains=D.days[x.day].exercises.filter(function(e){return e.main;});
    if(!mains.length) mains=D.days[x.day].exercises.filter(function(e){return e.w;}).slice(0,1);
    var brief=mains.slice(0,2).map(function(e){return e.name.replace('杠铃','').replace('（容量）','')+' '+prescriptionLabel(e);}).join(' / ');
    return x.date.slice(5)+' '+x.day+(brief?' · '+brief:'');
  }

    var preview=el('span','rule-preview'); ruleHighlights(body).forEach(function(p){preview.appendChild(el('span',null,esc(p)));}); head.appendChild(preview);
    var summary=el('summary'); summary.appendChild(head); item.appendChild(summary);
    item.appendChild(el('div','rule-body',esc(body))); ruleBox.appendChild(item);
  });
  document.getElementById('howNote').innerHTML =
    '<div class="how-step"><span class="num">01 / TRAIN</span><b>查看训练</b><p>在「训练」确认当天动作、重量、组次和 RPE。</p></div>'+
    '<div class="how-step"><span class="num">02 / RECORD</span><b>记录结果</b><p>复制练后模板，填入实际表现和身体反馈。</p></div>'+
    '<div class="how-step"><span class="num">03 / SYNC</span><b>同步数据</b><p>对 AI 说「同步工作台」，拉取 Notion 最新记录。</p></div>'+
    '<div class="how-step"><span class="num">04 / REVIEW</span><b>进入复盘</b><p>工作台看重点；完整判断直接打开 Obsidian 文件。</p></div>';

  var navBar = document.getElementById('navBar');
  var navs = [['today','训练','今日训练'],['week','计划','周期计划'],['trend','负荷','负荷趋势'],['record','复盘','训练复盘'],['settings','数据','数据与同步']];
  function setNav(k){
    document.querySelectorAll('.nav a').forEach(function(a){ a.classList.toggle('on', a.dataset.k===k); });
  }
  navs.forEach(function(n){
    var a = el('a', null); a.dataset.k = n[0]; a.href = '#';
    a.appendChild(el('i',null)); a.appendChild(el('span',null,n[1]));
    a.title = n[2];
    a.onclick = function(e){
      e.preventDefault();
      if(n[0]==='today') renderToday(todayName);
      document.querySelectorAll('section').forEach(function(s){ s.classList.remove('on'); });
      document.getElementById('m-' + n[0]).classList.add('on');
      setNav(n[0]);
      window.scrollTo({top:0, behavior:'smooth'});
    };
    navBar.appendChild(a);
  });
  setNav('today');
})();
</script>
</body>
</html>
