<script>
document.querySelectorAll('[data-coverage-tab]').forEach(function(button){button.addEventListener('click',function(){var key=button.getAttribute('data-coverage-tab');document.querySelectorAll('[data-coverage-tab]').forEach(function(x){x.classList.toggle('active',x===button)});document.querySelectorAll('[data-coverage-panel]').forEach(function(x){x.classList.toggle('active',x.getAttribute('data-coverage-panel')===key)});});});
var navLinks=[].slice.call(document.querySelectorAll('.sticky a'));var navTargets=navLinks.map(function(link){return document.querySelector(link.getAttribute('href'));}).filter(Boolean);function updateActiveNav(){var marker=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--nav-h'))+18;var active=navTargets[0];navTargets.forEach(function(target){if(target.getBoundingClientRect().top<=marker){active=target;}});if(window.scrollY+window.innerHeight>=document.documentElement.scrollHeight-2){active=navTargets[navTargets.length-1];}navLinks.forEach(function(link){link.classList.toggle('active',active&&link.getAttribute('href')==='#'+active.id);});}window.addEventListener('scroll',updateActiveNav,{passive:true});window.addEventListener('hashchange',updateActiveNav);updateActiveNav();
